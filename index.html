<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Design Quiz — ระบบฝึกทำข้อสอบ</title>
<meta name="description" content="ข้อสอบปรนัย 5 ตัวเลือก ครบทุกบทของวิชา Game Design I พร้อมเฉลยและคำอธิบายทุกตัวเลือก">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --primary:#243B64; --secondary:#0F766E;
  --selected:#E8EEF7; --ok-bg:#E8F5EC; --ok:#176B3A; --bad-bg:#FCEBEC; --bad:#B42332;
  --ink:#172B4D; --muted:#64748B; --line:#E2E8F0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  font-size:clamp(16px,.5vw + 14px,19px);line-height:1.8}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--secondary);outline-offset:2px}

.top{background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px clamp(12px,3vw,24px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--primary)}
.status{color:var(--muted);font-size:.9rem}
.bar{height:4px;background:var(--line)}
.bar>i{display:block;height:100%;background:var(--secondary);width:0}

main{max-width:820px;margin:0 auto;padding:clamp(14px,3vw,32px) clamp(12px,3vw,24px) 64px}

.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;padding:10px 20px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){background:#1b2d4e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--primary)}
.btn.ghost:hover:not(:disabled){background:var(--selected)}
.btn.teal{background:var(--secondary);border-color:var(--secondary)}
.btn.teal:hover:not(:disabled){background:#0b5f58}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3.5vw,36px)}
.qno{color:var(--secondary);font-weight:700;font-size:.9rem;margin:0 0 6px}
.q{font-size:1.18rem;font-weight:600;line-height:1.85;margin:0 0 22px;white-space:pre-line}
.q-img{display:block;max-width:100%;height:auto;margin:0 auto 20px;border:1px solid var(--line);border-radius:6px}

.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-height:56px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .lt{flex:0 0 auto;width:2em;height:2em;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt.sel{background:var(--selected);border:2px solid var(--primary);padding:13px 15px}
.opt.sel .lt{border-color:var(--primary);color:var(--primary)}
.opt.right{background:var(--ok-bg);border:2px solid var(--ok);padding:13px 15px;color:var(--ok)}
.opt.right .lt{border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border:2px solid var(--bad);padding:13px 15px;color:var(--bad)}
.opt.wrong .lt{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}

.result{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.verdict{font-size:1.15rem;font-weight:700;margin:0 0 4px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)} .verdict.skip{color:var(--muted)}
.answer-line{margin:0 0 16px;color:var(--ink)}
.explist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.explist li{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card)}
.explist li.right{background:var(--ok-bg);border-color:var(--ok)}
.explist li.wrong{background:var(--bad-bg);border-color:var(--bad)}
.exp-h{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.exp-h .lt{flex:0 0 auto}
.badge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:0 10px;margin-left:6px;white-space:nowrap}
.right .badge{color:var(--ok);border:1px solid var(--ok)}
.wrong .badge{color:var(--bad);border:1px solid var(--bad)}
li:not(.right):not(.wrong) .badge{color:var(--muted);border:1px solid var(--line)}
.exp-b{margin:6px 0 0 0;color:var(--ink);font-weight:400}

.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.nav-end{display:flex;gap:10px;flex-wrap:wrap}

.pal{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.pal h2{font-size:.95rem;margin:0 0 10px;color:var(--ink)}
.pal-grid{display:flex;flex-wrap:wrap;gap:8px}
.pn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.pn:hover{border-color:var(--primary)}
.pn.ans{background:var(--selected);color:var(--primary);border-color:var(--primary)}
.pn.cur{outline:3px solid var(--secondary);outline-offset:1px}
.pn.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pn.no{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid var(--line);border-radius:3px;vertical-align:-2px;margin-right:4px;background:var(--card)}
.legend i.a{background:var(--selected);border-color:var(--primary)}
.legend i.o{background:var(--ok-bg);border-color:var(--ok)}
.legend i.n{background:var(--bad-bg);border-color:var(--bad)}

h1.title{font-size:1.5rem;color:var(--primary);margin:6px 0 4px}
.lead{color:var(--ink);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;cursor:pointer;line-height:1.6}
.chap:hover{border-color:var(--primary)}
.chap b{color:var(--primary)}
.chap small{display:block;color:var(--muted)}

.score{font-size:2.6rem;font-weight:700;color:var(--primary);margin:0;line-height:1.2}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 18px}
.st-ok{color:var(--ok)} .st-no{color:var(--bad)} .st-sk{color:var(--muted)}

@media (max-width:600px){
  .top-in{padding:8px 12px}
  .opt{padding:12px;gap:10px}
  .opt.sel,.opt.right,.opt.wrong{padding:11px}
  .nav{position:sticky;bottom:0;background:var(--bg);padding:10px 0;margin-top:14px;border-top:1px solid var(--line)}
  .nav .btn{flex:1}
  .nav-end{flex:1 1 100%}
  .pn{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="top"><div class="top-in"><span class="brand">Game Design Quiz</span><span class="status" id="status"></span></div><div class="bar"><i id="bar"></i></div></div>
<main id="app"></main>

<script src="data/w01.js"></script><script src="data/w02.js"></script><script src="data/w03.js"></script>
<script src="data/w04.js"></script><script src="data/w05.js"></script><script src="data/w06.js"></script>
<script src="data/w07.js"></script><script src="data/w08.js"></script><script src="data/w09.js"></script>
<script src="data/w10.js"></script><script src="data/w11.js"></script><script src="data/w12.js"></script>
<script src="data/w13.js"></script>
<script>
(function(){
const LET=['ก','ข','ค','ง','จ'];
const app=document.getElementById('app'), statusEl=document.getElementById('status'), bar=document.getElementById('bar');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const strip=s=>String(s).replace(/^(ถูก|ผิด)\s*:\s*/,'');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function top0(){window.scrollTo(0,0)}

let run=null;

function home(){
  run=null;statusEl.textContent='';bar.style.width='0';
  const best=store('gd-best')||{};
  const ids=Object.keys(window.QUIZ).map(Number).sort((a,b)=>a-b);
  const tot=ids.reduce((s,i)=>s+window.QUIZ[i].qs.length,0);
  let h=`<h1 class="title">เลือกบทที่ต้องการทำ</h1>
  <p class="lead">ข้อสอบปรนัย 5 ตัวเลือก (ก–จ) ทุกข้อมีเฉลยและคำอธิบายครบทุกตัวเลือก ลำดับข้อและตัวเลือกจะถูกสุ่มใหม่ทุกครั้ง เลือกคำตอบแล้วกด “ยืนยันคำตอบ” เพื่อดูเฉลย</p>
  <div class="grid">`;
  ids.forEach(id=>{const q=window.QUIZ[id],b=best[id];
    h+=`<button class="chap" data-id="${id}"><b>บทที่ ${id}</b> · ${esc(q.title)}<small>${q.qs.length} ข้อ${b!=null?` · คะแนนสูงสุด ${b}/${q.qs.length}`:''}</small></button>`});
  h+=`<button class="chap" data-id="all"><b>รวมทุกบท</b> · สุ่ม 30 ข้อ<small>จากทั้งหมด ${tot} ข้อ${best.all!=null?` · คะแนนสูงสุด ${best.all}/30`:''}</small></button></div>`;
  app.innerHTML=h;
  app.querySelectorAll('.chap').forEach(b=>b.onclick=()=>start(b.dataset.id));
  top0();
}

function start(id){
  let items=[],title;
  if(id==='all'){
    Object.keys(window.QUIZ).forEach(k=>window.QUIZ[k].qs.forEach(q=>items.push({q,ch:k})));
    items=shuffle(items).slice(0,30);title='รวมทุกบท (สุ่ม 30 ข้อ)';
  }else{
    items=shuffle(window.QUIZ[id].qs.map(q=>({q,ch:id})));title='บทที่ '+id+' · '+window.QUIZ[id].title;
  }
  run={id,title,i:0,phase:'quiz',items:items.map(({q,ch})=>{
    const idx=shuffle([0,1,2,3,4]);
    return {ch,text:q[0],img:q[3]||null,opts:idx.map(k=>q[1][k]),exps:idx.map(k=>q[2][k]),right:idx.indexOf(0),sel:null,locked:false};
  })};
  render();top0();
}

const answered=()=>run.items.filter(x=>x.sel!=null).length;
const revealed=it=>run.phase==='review'||it.locked;

function render(){
  if(run.phase==='summary')return summary();
  const r=run,it=r.items[r.i],n=r.items.length,rev=revealed(it);
  statusEl.textContent=(r.phase==='review'?'ทบทวนเฉลย · ':'')+`ข้อ ${r.i+1}/${n} · ตอบแล้ว ${answered()}/${n}`;
  bar.style.width=((r.i+1)/n*100)+'%';
  let h=`<section class="card">
   <p class="qno">${esc(r.title)}${r.id==='all'?` · บทที่ ${it.ch}`:''} · ข้อ ${r.i+1}</p>
   <p class="q">${esc(it.text)}</p>${it.img?`<img class="q-img" src="${esc(it.img)}" alt="ภาพประกอบโจทย์">`:''}
   <div class="opts" role="radiogroup" aria-label="ตัวเลือก">`;
  it.opts.forEach((o,k)=>{
    let cls='opt',dis='';
    if(rev){dis='disabled';if(k===it.right)cls+=' right';else if(k===it.sel)cls+=' wrong'}
    else if(k===it.sel)cls+=' sel';
    h+=`<button class="${cls}" data-k="${k}" role="radio" aria-checked="${k===it.sel}" ${dis}><span class="lt">${LET[k]}</span><span class="tx">${esc(o)}</span></button>`;
  });
  h+='</div>';
  if(rev){
    const good=it.sel===it.right;
    h+=`<div class="result"><p class="verdict ${it.sel==null?'skip':good?'ok':'no'}">${it.sel==null?'— ไม่ได้ตอบข้อนี้':good?'✔ ถูก':'✘ ผิด'}</p>
    <p class="answer-line">${it.sel==null?'':`คุณตอบข้อ ${LET[it.sel]} · `}คำตอบที่ถูกต้องคือข้อ <b>${LET[it.right]}</b></p><ol class="explist">`;
    it.opts.forEach((o,k)=>{
      const isR=k===it.right,isU=k===it.sel;
      h+=`<li class="${isR?'right':isU?'wrong':''}"><div class="exp-h"><span class="lt">${LET[k]}.</span><span>${esc(o)}<span class="badge">${isR?'ข้อนี้ถูก':'ข้อนี้ผิด'}${isU?' · คำตอบของคุณ':''}</span></span></div><p class="exp-b">${esc(strip(it.exps[k]))}</p></li>`;
    });
    h+='</ol></div>';
  }
  h+='</section>';

  h+='<div class="nav"><button class="btn ghost" id="prev"'+(r.i===0?' disabled':'')+'>← ก่อนหน้า</button><div class="nav-end">';
  if(r.phase==='quiz'&&!it.locked)h+=`<button class="btn teal" id="confirm" ${it.sel==null?'disabled':''}>ยืนยันคำตอบ</button>`;
  h+=`<button class="btn ghost" id="next"${r.i===n-1?' disabled':''}>ถัดไป →</button>`;
  h+=r.phase==='quiz'?'<button class="btn" id="submit">จบและดูผล</button>':'<button class="btn" id="tosum">กลับไปหน้าสรุปผล</button>';
  h+='</div></div>';

  h+=`<div class="pal"><h2>สถานะแต่ละข้อ</h2><div class="pal-grid">`;
  r.items.forEach((x,k)=>{
    let c='pn';
    if(r.phase==='review'||x.locked){if(x.sel!=null)c+=x.sel===x.right?' ok':' no'}
    else if(x.sel!=null)c+=' ans';
    if(k===r.i)c+=' cur';
    h+=`<button class="${c}" data-n="${k}" aria-label="ข้อ ${k+1}${x.sel!=null?' ตอบแล้ว':' ยังไม่ได้ตอบ'}">${k+1}</button>`;
  });
  h+=`</div><div class="legend"><span><i></i>ยังไม่ได้ตอบ</span><span><i class="a"></i>ตอบแล้ว</span>`+'<span><i class="o"></i>ถูก</span><span><i class="n"></i>ผิด</span>'+`</div></div>`;
  h+=`<p style="margin-top:16px"><button class="btn ghost" id="quit">ออกไปเลือกบท</button></p>`;
  app.innerHTML=h;

  const $=id=>document.getElementById(id);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(revealed(it))return;it.sel=+b.dataset.k;render()});
  $('prev').onclick=()=>{if(r.i>0){r.i--;render();top0()}};
  $('next').onclick=()=>{if(r.i<n-1){r.i++;render();top0()}};
  if($('confirm'))$('confirm').onclick=()=>{if(it.sel!=null){it.locked=true;render();const e=document.querySelector('.result');if(e)e.scrollIntoView({block:'start'})}};
  if($('submit'))$('submit').onclick=submit;
  if($('tosum'))$('tosum').onclick=()=>{r.phase='summary';render()};
  $('quit').onclick=()=>{if(confirm('ออกจากข้อสอบนี้? ความคืบหน้าจะไม่ถูกบันทึก'))home()};
  app.querySelectorAll('.pn').forEach(b=>b.onclick=()=>{r.i=+b.dataset.n;render();top0()});
}

function submit(){
  const r=run,left=r.items.length-answered();
  if(left>0&&!confirm(`ยังไม่ได้ตอบ ${left} ข้อ ต้องการส่งข้อสอบหรือไม่?`))return;
  r.items.forEach(x=>x.locked=true);
  r.phase='summary';
  const score=r.items.filter(x=>x.sel===x.right).length;
  const best=store('gd-best')||{};
  if(best[r.id]==null||score>best[r.id])best[r.id]=score;store('gd-best',best);
  render();
}

function summary(){
  const r=run,n=r.items.length;
  const ok=r.items.filter(x=>x.sel===x.right).length,sk=r.items.filter(x=>x.sel==null).length,no=n-ok-sk;
  const pct=Math.round(ok/n*100);
  statusEl.textContent='สรุปผลการสอบ';bar.style.width='100%';
  let h=`<section class="card"><p class="qno">${esc(r.title)}</p>
  <p class="score">${ok} / ${n} <span style="font-size:1.1rem;color:var(--muted);font-weight:400">(${pct}%)</span></p>
  <div class="stats"><span class="st-ok">ถูก <b>${ok}</b></span><span class="st-no">ผิด <b>${no}</b></span><span class="st-sk">ไม่ได้ตอบ <b>${sk}</b></span></div>
  <div class="nav-end"><button class="btn teal" id="review">ทบทวนเฉลยทีละข้อ</button><button class="btn ghost" id="again">ทำใหม่ (สุ่มลำดับใหม่)</button><button class="btn ghost" id="toHome">เลือกบทอื่น</button></div></section>
  <div class="pal"><h2>ผลรายข้อ (กดเพื่อดูเฉลย)</h2><div class="pal-grid">`;
  r.items.forEach((x,k)=>{h+=`<button class="pn ${x.sel==null?'':x.sel===x.right?'ok':'no'}" data-n="${k}" aria-label="ข้อ ${k+1}">${k+1}</button>`});
  h+='</div><div class="legend"><span><i class="o"></i>ถูก</span><span><i class="n"></i>ผิด</span><span><i></i>ไม่ได้ตอบ</span></div></div>';
  app.innerHTML=h;top0();
  const go=k=>{r.phase='review';r.i=k;render();top0()};
  document.getElementById('review').onclick=()=>go(0);
  document.getElementById('again').onclick=()=>start(r.id);
  document.getElementById('toHome').onclick=home;
  app.querySelectorAll('.pn').forEach(b=>b.onclick=()=>go(+b.dataset.n));
}

home();
})();
</script>
</body>
</html>
